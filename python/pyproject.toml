[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runapi-wan"
version = "0.2.4"
description = "RunAPI Wan SDK for text-to-video, image-to-video, speech-to-video, animation, text-to-image, and edit-video workflows in JavaScript, Python, Ruby, Go, Java, and PHP"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "RunAPI", email = "contact@runapi.ai" }]
keywords = ["runapi", "runapi-ai", "wan", "api", "sdk", "typescript", "python", "ruby", "golang", "java", "maven", "gradle", "video-generation", "text-to-video", "video-api", "wan-video-api"]
dependencies = ["runapi-core>=0.5.1"]

[project.urls]
Homepage = "https://runapi.ai/models/wan"
Documentation = "https://runapi.ai/docs/resources/sdks"
Source = "https://github.com/runapi-ai/wan-sdk"
Issues = "https://github.com/runapi-ai/wan-sdk/issues"
Changelog = "https://github.com/runapi-ai/wan-sdk/blob/main/CHANGELOG.md"
"Release Notes" = "https://github.com/runapi-ai/wan-sdk/releases/tag/python%2Fv0.2.4"

[tool.hatch.build.targets.wheel]
packages = ["src/runapi"]

[tool.uv]
package = true

[dependency-groups]
dev = ["pytest>=8"]

[tool.runapi]
slug = "wan"
